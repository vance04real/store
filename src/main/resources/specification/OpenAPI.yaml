openapi: 3.0.0
info:
  title: store
  version: '1.0'
  description: A simple store
  contact:
    name: SecuritEase Dev
    url: 'https://www.securitease.com'
    email: internal@securitease.com
  termsOfService: 'https://www.securitease.com'
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0.htm'
servers:
  - url: 'http://localhost:8080'
    description: dev
paths:
  /orders:
    get:
      summary: Get Orders
      tags:
        - store
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderDTO'
        '500':
          description: Internal server error
      operationId: getOrders
      description: Get all orders
    post:
      summary: Create Order
      tags:
        - store
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '400':
          description: Bad Request - Validation failed or business rule violation
        '404':
          description: Customer or Product not found
        '500':
          description: Internal server error
      operationId: createOrder
      description: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDTO'
  /orders/{id}:
    get:
      summary: Get Order by ID
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Order ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '404':
          description: Order not found
        '500':
          description: Internal server error
      operationId: getOrderById
      description: Get a specific order by its ID
  /customers:
    get:
      summary: Get Customers
      tags:
        - store
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerDTO'
        '500':
          description: Internal server error
      operationId: getCustomers
      description: Get all customers
    post:
      summary: Create Customer
      tags:
        - store
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDTO'
        '400':
          description: Bad Request - Validation failed
        '500':
          description: Internal server error
      operationId: createCustomer
      description: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerDTO'
  /customers/search:
    get:
      summary: Search Customers by Name
      tags:
        - store
      parameters:
        - name: searchTerm
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Search query to match against customer names
          example: "john"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerDTO'
        '400':
          description: Bad Request - Missing or invalid query parameter
        '500':
          description: Internal server error
      operationId: searchCustomers
      description: Search customers by matching substring against first name, last name, or title
  /products:
    get:
      summary: Get Products
      tags:
        - store
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDTO'
      operationId: getProducts
      description: Get all products
    post:
      summary: Create Product
      tags:
        - store
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '400':
          description: Bad Request - Validation failed
        '500':
          description: Internal server error
      operationId: createProduct
      description: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDTO'

components:
  schemas:
    OrderDTO:
      type: object
      required:
        - description
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        description:
          type: string
          minLength: 1
          maxLength: 500
        customer:
          $ref: '#/components/schemas/OrderCustomerDTO'
        customerId:
          type: integer
          format: int64
          writeOnly: true
          description: ID of the customer placing the order
        productIds:
          type: array
          items:
            type: integer
            format: int64
          writeOnly: true
          minItems: 1
          description: List of product IDs to include in the order
        products:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              description:
                type: string
          readOnly: true

    OrderCustomerDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        suffix:
          type: string

    CustomerDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        suffix:
          type: string
        orders:
          type: array
          items:
            $ref: '#/components/schemas/CustomerOrderDTO'
          readOnly: true

    CustomerOrderDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        description:
          type: string

    ProductDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        description:
          type: string
        orders:
          type: array
          items:
            type: integer
            format: int64
            readOnly: true

tags:
  - name: store
    description: store operations
