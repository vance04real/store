openapi: 3.0.0
info:
  title: store
  version: '1.0'
  description: A simple store
  contact:
    name: SecuritEase Dev
    url: 'https://www.securitease.com'
    email: internal@securitease.com
  termsOfService: 'https://www.securitease.com'
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0.htm'
servers:
  - url: 'http://localhost:8080'
    description: dev

security:
  - basicAuth: []

paths:
  /orders:
    get:
      summary: Get Orders (Paginated)
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/DirectionParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/PaginatedOrderResponse'
        '400':
          description: Bad Request - Invalid pagination parameters
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: Internal server error
      operationId: getOrders
      description: Get all orders with pagination and sorting
    post:
      summary: Create Order
      tags:
        - store
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '400':
          description: Bad Request - Validation failed or business rule violation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Customer or Product not found
        '500':
          description: Internal server error
      operationId: createOrder
      description: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDTO'
  /orders/{id}:
    get:
      summary: Get Order by ID
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Order ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDTO'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Order not found
        '500':
          description: Internal server error
      operationId: getOrderById
      description: Get a specific order by its ID
  /customers:
    get:
      summary: Get Customers (Paginated)
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/DirectionParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/PaginatedCustomerResponse'
        '400':
          description: Bad request - Invalid pagination parameters
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: Internal server error
      operationId: getCustomers
      description: Get all customers with pagination and sorting
    post:
      summary: Create Customer
      tags:
        - store
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDTO'
        '400':
          description: Bad Request - Validation failed
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: Internal server error
      operationId: createCustomer
      description: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerDTO'
  /customers/search:
    get:
      summary: Search Customers by Name
      tags:
        - store
      parameters:
        - name: searchTerm
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Search query to match against customer names
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/DirectionParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/PaginatedCustomerResponse'
        '400':
          description: Bad Request - Missing or invalid query parameter
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: Internal server error
      operationId: searchCustomers
      description: Search customers by matching substring against first name, last name, or title paginated and sorted
  /products:
    get:
      summary: Get Products
      tags:
        - store
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/DirectionParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/PaginatedProductResponse'
        '401':
          description: Bad Request - Invalid pagination parameters
        '500':
          description: Internal server error
      operationId: getProducts
      description: Get all products
    post:
      summary: Create Product
      tags:
        - store
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '400':
          description: Bad Request - Validation failed
        '500':
          description: Internal server error
      operationId: createProduct
      description: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDTO'
  /products/{id}:
    get:
      summary: Get Product by ID
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Product ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '404':
          description: Product not found
        '500':
          description: Internal server error
      operationId: getProductById
      description: Get a specific product by its ID

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Basic Authentication using username and password.
        
        **Demo Credentials:**
        - Username: `admin`, Password: `password` (USER role)
        - Username: `store-admin`, Password: `admin123` (ADMIN role)

  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              timestamp:
                type: string
                format: date-time
              path:
                type: string
              status:
                type: integer
          example:
            message: "Full authentication is required to access this resource"
            timestamp: "2025-08-09T10:30:00.123456Z"
            path: "/customers"
            status: 401

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Page number (0-based)
      example: 0

    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Number of items per page
      example: 20

    SortParam:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: "id"
      description: Field to sort by
      example: "firstName"

    DirectionParam:
      name: direction
      in: query
      required: false
      schema:
        type: string
        enum: [ ASC, DESC ]
        default: "ASC"
      description: Sort direction
      example: "ASC"

  schemas:
    PaginatedCustomerResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerDTO'
        hasPages:
          type: boolean
          description: Whether there are multiple pages
        currentPage:
          type: integer
          description: Current page number (0-based)
        totalPages:
          type: integer
          description: Total number of pages
        totalItems:
          type: integer
          format: int64
          description: Total number of items across all pages
      required:
        - data
        - hasPages
        - currentPage
        - totalPages
        - totalItems

    PaginatedOrderResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderDTO'
        hasPages:
          type: boolean
        currentPage:
          type: integer
        totalPages:
          type: integer
        totalItems:
          type: integer
          format: int64
      required:
        - data
        - hasPages
        - currentPage
        - totalPages
        - totalItems

    PaginatedProductResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductDTO'
        hasPages:
          type: boolean
        currentPage:
          type: integer
        totalPages:
          type: integer
        totalItems:
          type: integer
          format: int64
      required:
        - data
        - hasPages
        - currentPage
        - totalPages
        - totalItems

    OrderDTO:
      type: object
      required:
        - description
        - customerId
        - productIds
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        description:
          type: string
          minLength: 1
          maxLength: 500
          pattern: "^\\S.*\\S$"
        customer:
          $ref: '#/components/schemas/OrderCustomerDTO'
        customerId:
          type: integer
          format: int64
          minimum: 1
          writeOnly: true
          description: ID of the customer placing the order
        productIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          writeOnly: true
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: List of product IDs to include in the order
        products:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              description:
                type: string
          readOnly: true

    OrderCustomerDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        suffix:
          type: string

    CustomerDTO:
      type: object
      required:
        - firstName
        - lastName
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
          maxLength: 10
        firstName:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
        suffix:
          type: string
          maxLength: 10
        orders:
          type: array
          items:
            $ref: '#/components/schemas/CustomerOrderDTO'
          readOnly: true

    CustomerOrderDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        description:
          type: string

    ProductDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        description:
          type: string
          minLength: 1
          maxLength: 500
          pattern: "^\\S.*\\S$"
        orders:
          type: array
          items:
            type: integer
            format: int64
            readOnly: true

tags:
  - name: store
    description: store operations
