# CI/CD Pipeline for Interview Demo
# ================================

name: Store Application CI/CD

# Trigger on pushes to your feature branch
on:
  push:
    branches: [ feature/TI-100/interview-task ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # JOB 1: BUILD AND TEST
  # ====================
  build-and-test:
    name: 🔨 Build & Test Store Application
    runs-on: ubuntu-latest

    # Start PostgreSQL for testing
    services:
      postgres:
        image: postgres:16.2
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: store
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      # STEP 1: Get your code
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # STEP 2: Install Java
      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # STEP 3: Cache Gradle (speeds up builds)
      - name: 💾 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # STEP 4: Make gradlew executable
      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      # STEP 5: Generate OpenAPI classes (CRUCIAL!)
      - name: 🏗️ Generate OpenAPI classes
        run: |
          echo "🔧 Generating OpenAPI classes..."
          ./gradlew openApiGenerate
          echo "OpenAPI classes generated successfully"
          ls -la build/generated/src/main/java/com/example/store/

      # STEP 6: Check code formatting
      - name: Check code formatting
        run: ./gradlew spotlessCheck
        continue-on-error: true  # Don't fail build for formatting

      # STEP 7: Build application
      - name: Build application
        run: |
          echo "Building application..."
          ./gradlew build -x test
          echo "Application built successfully"
          ls -la build/libs/

      # STEP 8: Run tests with database
      - name: Run tests
        run: |
          echo "Running tests with PostgreSQL database..."
          ./gradlew test
          echo "All tests passed!"
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/store
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: admin

      # STEP 9: Generate test coverage
      - name: Generate test coverage report
        run: |
          ./gradlew jacocoTestReport
          echo "Coverage report generated"

      # STEP 10: Upload test results
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          retention-days: 30

      # STEP 11: Upload JAR artifact
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-app-jar
          path: build/libs/*.jar
          retention-days: 30

  # JOB 2: BUILD DOCKER IMAGE
  # =========================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test  # Only run if tests pass!

    permissions:
      contents: read
      packages: write

    steps:
      # STEP 1: Get your code
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 2: Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # STEP 3: Login to GitHub Container Registry
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STEP 4: Extract metadata for tags
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # STEP 5: Build and push Docker image
      - name: 🔨 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # STEP 6: Test the Docker image
      - name: Test Docker image
        run: |
          echo "Testing Docker image..."
          # Test that image was built and pushed successfully
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          echo "Docker image pulled successfully!"
          
          # Basic image inspection
          docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          echo "Docker image inspection completed!"

  # JOB 3: SECURITY SCAN
  # ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'  # Don't fail on vulnerabilities for demo

      - name: Security scan complete
        run: echo "Security scan completed successfully!"

  # JOB 4: SUMMARY
  # ==============
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, build-docker, security-scan]
    if: always()

    steps:
      - name: Display build summary
        run: |
          echo "BUILD SUMMARY"
          echo "==============="
          echo "Tests: ${{ needs.build-and-test.result }}"
          echo "Docker: ${{ needs.build-docker.result }}"
          echo "Security: ${{ needs.security-scan.result }}"
          echo ""
          echo "Pipeline completed for interview demo!"
          echo "Docker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "View results: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"